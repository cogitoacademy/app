name: cogito-app

services:
  postgres:
    image: postgres:16-alpine
    container_name: cogito-app-postgres
    environment:
      POSTGRES_DB: cogito-app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "6767:5432"
    volumes:
      - cogito-app_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # C6: give postgres time to fast-shutdown instead of killing 20 pooled
    # connections with SIGKILL (which spams FATAL lines and can corrupt state).
    stop_grace_period: 30s

  redis:
    image: redis:7-alpine
    container_name: cogito-app-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  cogito-app_postgres_data:
