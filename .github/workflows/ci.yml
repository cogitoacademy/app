name: CI
# F14 (CI performance): keep dependency and Turbo caches reusable across jobs,
# avoid rebuilding the web app during type checking, and run PR checks only for
# affected packages where the full repository history is available.
# F5 (CI-SANITY): pull_request-only (+ manual dispatch). The old
# `push: [main, staging]` trigger re-ran the full 4-job suite on every
# squash-merge commit even though every merge commit is already gated by
# its PR run — pure duplicate CI spend. Required check contexts (lint,
# Type Check, Build, Test + Coverage) and the other workflow triggers
# (labeler / semantic-pr / infra-plan / auto-merge) are unaffected.
on:
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        # git-auto-commit-action v7 restored detached-HEAD detection (v6/v5
        # tolerated it): PR checkouts default to a detached HEAD and the
        # v7 commit step fails with "ref HEAD is not a symbolic ref".
        # Checking out the head ref keeps a real branch checked out so the
        # auto-fix commit + push works exactly as it did on v5.
        #
        # S8: checkout with the fine-grained PAT so the auto-fix push is
        # attributed to a human and the re-triggered pull_request runs are
        # NOT gated behind the "action_required" approval that
        # github-actions[bot] pushes trigger. git-auto-commit-action@v7 has
        # no token input and ignores GITHUB_TOKEN env overrides — it pushes
        # with whatever credentials checkout configured (verified 2026-09-04:
        # both a `token:` input and a GITHUB_TOKEN env var left the push
        # attributed to github-actions[bot]).
        with:
          ref: ${{ github.head_ref }}
          # S8/F9 regression (2026-09-04): PR #189 replaced this input with a
          # bare `secrets.ACTIONS_BOT_PAT`. Dependabot branches receive NO
          # repository secrets, so the input arrived EMPTY and actions/checkout
          # failed with "Input required and not supplied: token" — every
          # dependabot PR went red and auto-merge stopped. The `|| github.token`
          # fallback (479956f, ci/self-approve-bot-commits) degrades to the
          # default token on dependabot runs; human PRs still use the PAT.
          token: ${{ secrets.ACTIONS_BOT_PAT || github.token }}
      - uses: oven-sh/setup-bun@v2.2.0
      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-install-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-install-
      - run: bun install --frozen-lockfile
      - name: Apply auto-fixable lint and format fixes
        run: |
          bunx oxlint@1.80.0 --fix || true
          bunx oxfmt@0.65.0 --write || true
      - name: Check last commit message
        id: commit-check
        run: echo "last-commit-msg=$(git log -1 --format='%s')" >> "$GITHUB_OUTPUT"
      - name: Commit auto-fixes
        # C7: only on pull_request events (never auto-commit to main on push),
        # only for non-fork branches, and never when the last commit is our
        # own auto-fix commit (identified by its message, not its author —
        # author-based guards break once the push uses a PAT).
        #
        # S8: when ACTIONS_BOT_PAT is set (a fine-grained PAT scoped to this
        # repo with contents:write), the auto-fix push is attributed to the
        # PAT owner (a human) and the re-triggered pull_request runs are NOT
        # gated behind the "action_required" approval that github-actions[bot]
        # pushes trigger. Without the PAT, the action falls back to
        # GITHUB_TOKEN and the bot-commit approval gate applies — the operator
        # must create the secret (or enable the repo setting "Allow GitHub
        # Actions to create and approve pull requests").
        if: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.commit-check.outputs.last-commit-msg != 'style: apply automated lint and format fixes' }}"
        uses: stefanzweifel/git-auto-commit-action@v7
        # The action pushes its commit from the checkout; do not run the local
        # pre-push hook there. The dedicated baseline and format gates below
        # are the CI checks for this job.
        #
        # S8: the push uses the credentials actions/checkout configured —
        # the ACTIONS_BOT_PAT passed to checkout above — so the auto-fix
        # commit is attributed to a human and the re-triggered runs are not
        # gated behind approval (verified 2026-09-04).
        env:
          LEFTHOOK: "0"
        with:
          commit_message: "style: apply automated lint and format fixes"
          commit_options: "--no-verify"
          commit_user_name: cogito-bot
          commit_user_email: bot@cogitoacademy.id
          commit_author: cogito-bot <bot@cogitoacademy.id>
      - name: Verify lint (errors fail; desceded web findings checked against baseline)
        run: bun .github/lint/check-baseline.ts
      - name: Verify formatting
        run: bunx oxfmt@0.65.0 --check

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2.2.0
      - uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            .turbo
          key: ${{ runner.os }}-turbo-typecheck-${{ github.sha }}-${{ hashFiles('bun.lock', '**/package.json', 'turbo.json', '**/tsconfig*.json') }}
          restore-keys: ${{ runner.os }}-turbo-typecheck-
      - name: Ensure main is fetchable (Turbo --affected base)
        # Turbo --affected resolves its merge base against the repository's
        # default branch ("main"). On Dependabot pull_request runs the checkout
        # omits the base and turbo failed with "Failed to resolve base ref
        # 'main'" (see PR #145 / the weekly bun group). Fetching the default
        # branch once makes the merge-base computation deterministic — no
        # behavior change for human PRs (main is already present there).
        run: git fetch origin "${{ github.event.repository.default_branch }}" --depth=1 || git fetch origin "${{ github.event.repository.default_branch }}"
      - run: bun install --frozen-lockfile
      - name: Type-check affected packages on pull requests
        if: ${{ github.event_name == 'pull_request' }}
        run: bun run check-types -- --affected
      - name: Type-check all packages on manual runs
        if: ${{ github.event_name != 'pull_request' }}
        run: bun run check-types

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2.2.0
      - uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            .turbo
          key: ${{ runner.os }}-turbo-build-${{ github.sha }}-${{ hashFiles('bun.lock', '**/package.json', 'turbo.json', '**/tsconfig*.json', '**/vite.config.*', '**/tsdown.config.*') }}
          restore-keys: ${{ runner.os }}-turbo-build-
      - name: Ensure main is fetchable (Turbo --affected base)
        run: git fetch origin "${{ github.event.repository.default_branch }}" --depth=1 || git fetch origin "${{ github.event.repository.default_branch }}"
      - run: bun install --frozen-lockfile
      - name: Build affected packages on pull requests
        if: ${{ github.event_name == 'pull_request' }}
        run: bun run build -- --affected
      - name: Build all packages on manual runs
        if: ${{ github.event_name != 'pull_request' }}
        run: bun run build

  test:
    name: Test + Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: cogito-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/cogito-test
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-secret-at-least-32-characters-long-xxxx
      BETTER_AUTH_URL: http://localhost:3001
      CORS_ORIGIN: http://localhost:3000
      PAYMENT_WEBHOOK_SECRET: ci-payment-webhook-secret-at-least-32-characters-long
      SANITY_PROJECT_ID: skfmwuke
      NODE_ENV: test
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2.2.0
      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-install-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-install-
      - run: bun install --frozen-lockfile
      - name: Create env file for drizzle
        run: |
          echo "DATABASE_URL=${{ env.DATABASE_URL }}" > apps/server/.env
          echo "REDIS_URL=${{ env.REDIS_URL }}" >> apps/server/.env
          echo "BETTER_AUTH_SECRET=${{ env.BETTER_AUTH_SECRET }}" >> apps/server/.env
          echo "BETTER_AUTH_URL=${{ env.BETTER_AUTH_URL }}" >> apps/server/.env
          echo "CORS_ORIGIN=${{ env.CORS_ORIGIN }}" >> apps/server/.env
          echo "PAYMENT_WEBHOOK_SECRET=${{ env.PAYMENT_WEBHOOK_SECRET }}" >> apps/server/.env
          echo "SANITY_PROJECT_ID=${{ env.SANITY_PROJECT_ID }}" >> apps/server/.env
          echo "PAYMENT_PROVIDER=stub" >> apps/server/.env
      - run: bun run db:migrate
      - name: Test with coverage
        id: coverage
        run: bun test --coverage --coverage-reporter=lcov --timeout 30000 packages/api/src/tests/ packages/env/src/ packages/auth/src/ packages/db/src/ apps/server/src/openapi.test.ts
        continue-on-error: true
      - name: "Server unit tests (separate process: webhook test uses mock.module)"
        run: bun test --timeout 30000 apps/server/src/
      - name: Post coverage comment + enforce gate
        # Keep a failed test suite as the primary failure. The coverage command
        # itself still runs the gate below when it was actually attempted.
        if: ${{ always() && steps.coverage.outcome != 'skipped' }}
        run: bun .github/scripts/coverage-comment.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LCOV_FILE: ./coverage/lcov.info
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COVERAGE_API_THRESHOLD: 100
          COVERAGE_OVERALL_THRESHOLD: 100
          COVERAGE_FUNCTIONS_THRESHOLD: 100
          COVERAGE_BRANCHES_THRESHOLD: 100
      - name: Fail if coverage test command failed
        if: ${{ always() && steps.coverage.outcome == 'failure' }}
        run: exit 1

  e2e:
    name: E2E Browser Workflow
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: cogito-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/cogito-test
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-secret-at-least-32-characters-long-xxxx
      BETTER_AUTH_URL: http://localhost:3101
      SERVER_URL: http://localhost:3101
      WEB_URL: http://localhost:3100
      WEB_PORT: 3100
      VITE_SERVER_URL: http://localhost:3101
      CORS_ORIGIN: http://localhost:3100
      PAYMENT_WEBHOOK_SECRET: ci-payment-webhook-secret-at-least-32-characters-long
      PAYMENT_PROVIDER: stub
      SANITY_PROJECT_ID: skfmwuke
      NODE_ENV: test
      SEED_STUDENT_PASSWORD: Student123!
      SEED_TUTOR_PASSWORD: Tutor123!
      SEED_ADMIN_PASSWORD: AdminPassword123!
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2.2.0
      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-install-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-install-
      - run: bun install --frozen-lockfile
      - name: Create isolated E2E environment
        run: |
          echo "DATABASE_URL=${{ env.DATABASE_URL }}" > apps/server/.env.test
          echo "REDIS_URL=${{ env.REDIS_URL }}" >> apps/server/.env.test
          echo "PORT=3101" >> apps/server/.env.test
          echo "WEB_PORT=${{ env.WEB_PORT }}" >> apps/server/.env.test
          echo "BETTER_AUTH_SECRET=${{ env.BETTER_AUTH_SECRET }}" >> apps/server/.env.test
          echo "BETTER_AUTH_URL=${{ env.BETTER_AUTH_URL }}" >> apps/server/.env.test
          echo "CORS_ORIGIN=${{ env.CORS_ORIGIN }}" >> apps/server/.env.test
          echo "VITE_SERVER_URL=${{ env.VITE_SERVER_URL }}" >> apps/server/.env.test
          echo "PAYMENT_PROVIDER=${{ env.PAYMENT_PROVIDER }}" >> apps/server/.env.test
          echo "PAYMENT_WEBHOOK_SECRET=${{ env.PAYMENT_WEBHOOK_SECRET }}" >> apps/server/.env.test
          echo "SANITY_PROJECT_ID=${{ env.SANITY_PROJECT_ID }}" >> apps/server/.env.test
          echo "NODE_ENV=${{ env.NODE_ENV }}" >> apps/server/.env.test
          echo "SEED_STUDENT_PASSWORD=${{ env.SEED_STUDENT_PASSWORD }}" >> apps/server/.env.test
          echo "SEED_TUTOR_PASSWORD=${{ env.SEED_TUTOR_PASSWORD }}" >> apps/server/.env.test
          echo "SEED_ADMIN_PASSWORD=${{ env.SEED_ADMIN_PASSWORD }}" >> apps/server/.env.test
      - name: Migrate isolated E2E database
        run: bun run db:migrate
        env:
          ENV_FILE: ../../apps/server/.env.test
      - name: Install Chromium
        # Resolve the CLI from the E2E workspace so the browser revision
        # matches its locked @playwright/test dependency. Running bunx from
        # the repository root can resolve a transient CLI and leave the
        # headless-shell revision expected by the tests uninstalled.
        working-directory: packages/e2e
        run: bunx playwright install --with-deps chromium
      - name: Run browser workflow
        run: bun run test:e2e
      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            packages/e2e/playwright-report
            packages/e2e/test-results
          if-no-files-found: ignore
          retention-days: 14
