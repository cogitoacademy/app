name: Deploy Staging

on:
  push:
    branches: [staging]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Required so the GITHUB_TOKEN can push images to GHCR (the org must also
    # allow Actions package creation).
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server
        run: |
          docker build -t ghcr.io/${{ github.repository }}/server:staging -f apps/server/Dockerfile .
          docker push ghcr.io/${{ github.repository }}/server:staging

      - name: Build and push web
        run: |
          docker build \
            -t ghcr.io/${{ github.repository }}/web:staging \
            -f apps/web/Dockerfile \
            --build-arg VITE_SERVER_URL=https://staging.cogitoacademy.id \
            .
          docker push ghcr.io/${{ github.repository }}/web:staging

      - name: Trigger Coolify deploy
        # Fail loudly when the webhook secret is unset or the request fails —
        # a silent no-op deploy is worse than a red build.
        run: |
          curl --fail --max-time 30 -X POST ${{ secrets.COOLIFY_STAGING_WEBHOOK }}

      - name: Health check
        # Same bounded retry loop as cd-prod: Coolify restarts the container
        # asynchronously, so poll until the API is healthy (up to ~5 min).
        run: |
          for i in $(seq 1 20); do
            if curl -fsS --max-time 10 https://staging.cogitoacademy.id/health; then
              echo "API healthy after ${i} attempts"
              exit 0
            fi
            echo "attempt ${i}/20: not healthy yet, waiting 15s"
            sleep 15
          done
          echo "API did not become healthy within the timeout" >&2
          exit 1
