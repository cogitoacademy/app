name: Deploy Staging

on:
  push:
    branches: [staging]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Required so the GITHUB_TOKEN can push images to GHCR (the org must also
    # allow Actions package creation).
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server
        run: |
          docker build -t ghcr.io/${{ github.repository }}/server:staging -f apps/server/Dockerfile .
          docker push ghcr.io/${{ github.repository }}/server:staging

      - name: Build and push web
        run: |
          docker build -t ghcr.io/${{ github.repository }}/web:staging -f apps/web/Dockerfile .
          docker push ghcr.io/${{ github.repository }}/web:staging

      - name: Trigger Coolify deploy
        # Fail loudly when the webhook secret is unset or the request fails —
        # a silent no-op deploy is worse than a red build.
        run: |
          curl --fail --max-time 30 -X POST ${{ secrets.COOLIFY_STAGING_WEBHOOK }}
