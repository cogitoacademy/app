name: Semantic PR

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  # Named `semantic-pr` (was `lint`): the job name is the check context shown
  # on PRs, and `lint` collided with the CI workflow's Lint job — every PR
  # showed a confusing duplicate `lint` check.
  semantic-pr:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            docs
            test
            chore
            ci
            perf
            deps
            docker
