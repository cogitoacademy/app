name: Deploy Production

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Build+push (~3 min) + migrate-and-deploy (backup, migrate, deploy,
    # sha-verified health poll up to 20x15s ≈ 5 min) need headroom.
    timeout-minutes: 20
    # Required so the GITHUB_TOKEN can push images to GHCR. Without this the
    # push fails with "denied: installation not allowed to Create organization
    # package" (the org must also allow Actions package creation).
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server
        run: |
          docker build \
            -t ghcr.io/${{ github.repository }}/server:latest \
            -f apps/server/Dockerfile \
            --build-arg GIT_SHA=${{ github.sha }} \
            .
          docker tag ghcr.io/${{ github.repository }}/server:latest ghcr.io/${{ github.repository }}/server:v${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/server:latest
          docker push ghcr.io/${{ github.repository }}/server:v${{ github.sha }}

      - name: Build and push web
        run: |
          docker build \
            -t ghcr.io/${{ github.repository }}/web:latest \
            -f apps/web/Dockerfile \
            --build-arg VITE_SERVER_URL=https://api.cogitoacademy.id \
            .
          docker tag ghcr.io/${{ github.repository }}/web:latest ghcr.io/${{ github.repository }}/web:v${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/web:latest
          docker push ghcr.io/${{ github.repository }}/web:v${{ github.sha }}

      - name: Backup, migrate, deploy, sha-verified health poll
        # Full production pipeline via scripts/migrate-and-deploy.sh:
        #   1. pg_dump snapshot → gzip → R2 (pre-migrate-<sha>.sql.gz)
        #   2. bun run db:migrate against the production DATABASE_URL
        #   3. POST the Coolify server deploy webhook
        #   4. Poll /health until `version == GIT_SHA` (bounded 20x15s)
        #   5. On failure: clear rollback hint (previous v<prev-sha> image)
        # The script fails loudly when any required env is unset.
        #
        # Secrets required (operator adds them in repo Settings → Secrets):
        #   COOLIFY_PROD_SERVER_WEBHOOK — resolvable Coolify deploy webhook URL
        #     (https://coolify.cogitoacademy.id/api/v1/deploy?uuid=...)
        #   PROD_DATABASE_URL, R2_ACCOUNT_ID, R2_ACCESS_KEY_ID,
        #   R2_SECRET_ACCESS_KEY, R2_BUCKET — backup target credentials
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_PROD_SERVER_WEBHOOK }}
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          GIT_SHA: ${{ github.sha }}
          HEALTH_URL: https://api.cogitoacademy.id/health
          # Previous commit on the push = the last deployed sha (rollback hint).
          PREV_GIT_SHA: ${{ github.event.before }}
        run: |
          bash scripts/migrate-and-deploy.sh

      - name: Trigger Coolify web deploy
        run: |
          if [ -z "${{ secrets.COOLIFY_PROD_WEBHOOK }}" ]; then
            echo "COOLIFY_PROD_WEBHOOK is unset — configure the Coolify resource webhook and add it as a GitHub secret" >&2
            exit 1
          fi
          curl --fail --max-time 30 -X POST ${{ secrets.COOLIFY_PROD_WEBHOOK }}
