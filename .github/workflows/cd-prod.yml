name: Deploy Production

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Required so the GITHUB_TOKEN can push images to GHCR. Without this the
    # push fails with "denied: installation not allowed to Create organization
    # package" (the org must also allow Actions package creation).
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server
        run: |
          docker build -t ghcr.io/${{ github.repository }}/server:latest -f apps/server/Dockerfile .
          docker tag ghcr.io/${{ github.repository }}/server:latest ghcr.io/${{ github.repository }}/server:v${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/server:latest
          docker push ghcr.io/${{ github.repository }}/server:v${{ github.sha }}

      - name: Build and push web
        run: |
          docker build \
            -t ghcr.io/${{ github.repository }}/web:latest \
            -f apps/web/Dockerfile \
            --build-arg VITE_SERVER_URL=https://api.cogitoacademy.id \
            .
          docker tag ghcr.io/${{ github.repository }}/web:latest ghcr.io/${{ github.repository }}/web:v${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/web:latest
          docker push ghcr.io/${{ github.repository }}/web:v${{ github.sha }}

      - name: Trigger Coolify server deploy
        # Fail loudly when the webhook secret is unset or the request fails —
        # a silent no-op deploy is worse than a red build. The explicit guard
        # turns an unset secret into a readable message instead of a bare
        # `curl exit 6 "Could not resolve host"` (S7: the webhook URL host had
        # no DNS record because the Coolify control plane is tailnet-only; the
        # operator recreates the secrets with the resolvable
        # https://coolify.cogitoacademy.id/api/v1/deploy?uuid=... URL — only
        # the deploy-webhook path is exposed, the UI stays tailnet-only).
        run: |
          if [ -z "${{ secrets.COOLIFY_PROD_SERVER_WEBHOOK }}" ]; then
            echo "COOLIFY_PROD_SERVER_WEBHOOK is unset — configure the Coolify resource webhook and add it as a GitHub secret" >&2
            exit 1
          fi
          curl --fail --max-time 30 -X POST ${{ secrets.COOLIFY_PROD_SERVER_WEBHOOK }}

      - name: Trigger Coolify web deploy
        run: |
          if [ -z "${{ secrets.COOLIFY_PROD_WEBHOOK }}" ]; then
            echo "COOLIFY_PROD_WEBHOOK is unset — configure the Coolify resource webhook and add it as a GitHub secret" >&2
            exit 1
          fi
          curl --fail --max-time 30 -X POST ${{ secrets.COOLIFY_PROD_WEBHOOK }}

      - name: Health check
        # Coolify pulls the new images and restarts the containers asynchronously;
        # a single sleep+curl is flaky. Poll with a bounded retry loop (up to
        # ~5 min) and fail the job only if the API never comes back healthy.
        run: |
          for i in $(seq 1 20); do
            if curl -fsS --max-time 10 https://api.cogitoacademy.id/health; then
              echo "API healthy after ${i} attempts"
              exit 0
            fi
            echo "attempt ${i}/20: not healthy yet, waiting 15s"
            sleep 15
          done
          echo "API did not become healthy within the timeout" >&2
          exit 1
