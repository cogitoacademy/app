# actions/labeler@v7 configuration. Each label is a list of matchers;
# a PR gets a label when any matcher matches its changed files
# (changed-files → any-glob-to-any-file).

server:
  - changed-files:
      - any-glob-to-any-file:
          - apps/server/**
          - packages/api/**
          - packages/auth/**
          - packages/db/**
          - packages/env/**

web:
  - changed-files:
      - any-glob-to-any-file:
          - apps/web/**
          - packages/ui/**

infrastructure:
  - changed-files:
      - any-glob-to-any-file:
          - infra/**
          - .github/workflows/**
          - docker-compose*.yml
          - apps/server/Dockerfile
          - apps/web/Dockerfile

docs:
  - changed-files:
      - any-glob-to-any-file:
          - docs/**
          - "*.md"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - bun.lock
          - package.json
          - packages/**/package.json
          - .github/dependabot.yml

github-actions:
  - changed-files:
      - any-glob-to-any-file:
          - .github/**
