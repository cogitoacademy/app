server:
  - any:
      - apps/server/**/*
      - packages/api/**/*
      - packages/auth/**/*
      - packages/db/**/*
      - packages/env/**/*

web:
  - any:
      - apps/web/**/*
      - packages/ui/**/*

infrastructure:
  - any:
      - infra/**/*
      - .github/workflows/**/*
      - apps/server/Dockerfile
      - apps/web/Dockerfile

docs:
  - any:
      - docs/**/*
      - "*.md"
