# dashboards.yml — Grafana dashboard file provider (source of truth in git).
#
# Declared by infra/ansible/observability.yml (mounted read-only into
# `cogito-grafana` at /etc/grafana/provisioning/dashboards/). The four JSON
# files beside this one are the provisioned dashboards: App RED, Logs &
# Traces, Infra, Delivery. UI edits are disabled (allowUiUpdates: false) so
# the files stay the source of truth; iterate in git, not in the UI.
apiVersion: 1

providers:
  - name: cogito
    orgId: 1
    folder: Cogito
    # Pinned to the folder UID that holds the file-provisioned alert-rule
    # group (verified live 2026-09-06: rules live in afxfpsyn1jldse, boards
    # were in efxc1qs6nad4wd — same title, different objects). File alert
    # provisioning accepts only `folder` (title), so the dashboards move to
    # the rules, never vice versa; on next poll the 4 boards join the rule
    # group in one Cogito folder and the leftover empty is deleted once in
    # the UI. Title stays as the human label.
    folderUid: afxfpsyn1jldse
    type: file
    disableDeletion: true
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /etc/grafana/provisioning/dashboards
