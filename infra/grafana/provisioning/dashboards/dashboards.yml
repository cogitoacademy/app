# dashboards.yml — Grafana dashboard file provider (source of truth in git).
#
# Declared by infra/ansible/observability.yml (mounted read-only into
# `cogito-grafana` at /etc/grafana/provisioning/dashboards/). The four JSON
# files beside this one are the provisioned dashboards: App RED, Logs &
# Traces, Infra, Delivery. UI edits are disabled (allowUiUpdates: false) so
# the files stay the source of truth; iterate in git, not in the UI.
apiVersion: 1

providers:
  - name: cogito
    orgId: 1
    folder: Cogito
    # Pinned to afxfpsyn1jldse — the folder UID where the file-provisioned
    # alert rules actually live (proven live 2026-09-07 via the alert-rules
    # provisioning API: all 4 rules carry folderUID afxfpsyn1jldse). An
    # earlier change (#216) pinned efxc1qs6nad4wd based on a misread of
    # alert-state log labels (those were stale persisted states failing to
    # save with sqlite 'database is locked', not the rules' home) — that pin
    # is hereby reverted. File alert provisioning accepts only `folder`
    # (title), so boards (UID-pinned here) move to the rules, never vice
    # versa. Provisioning only re-saves files whose CONTENT changed, so every
    # folder move must ride with a content touch in each board JSON
    # (see #217). After apply, confirm all 4 boards + 4 rules share this
    # folder, then delete the empty duplicate efxc1qs6nad4wd once via
    # DELETE /api/folders (verify empty first). Play 3 is create-when-missing
    # so it never recreates the duplicate while one Cogito folder exists.
    folderUid: afxfpsyn1jldse
    type: file
    disableDeletion: true
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /etc/grafana/provisioning/dashboards
