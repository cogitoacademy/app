# loki-prom.yml — Grafana provisioned datasources (source of truth in git).
#
# Declared by infra/ansible/observability.yml (mounted read-only into
# `cogito-grafana` at /etc/grafana/provisioning/datasources/). URLs use the
# shared `cogito-obs` Docker network service names (each Coolify service
# otherwise gets its OWN isolated network — verified live 2026-09-05).
# Grafana itself is tailnet-only — no public domain, no anonymous auth
# (see the compose in the playbook).
apiVersion: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: false
    jsonData:
      maxLines: 1000
      timeout: 30

  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    editable: false
    jsonData:
      timeInterval: 15s
      queryTimeout: 30s
      httpMethod: POST
