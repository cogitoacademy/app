# rules.yaml — Grafana-managed alert rules (source of truth in git).
#
# File-provisioned (the alert-rules API 500s on this Grafana build for
# API-created groups; files load cleanly — verified live 2026-09-05).
# Notification routing: the default policy receiver is `Discord-ops`
# (created via API; holds the vault webhook URL, never in git), so rules
# below need no per-rule receiver. Folder `Cogito` is created once via API.
apiVersion: 1

groups:
  - orgId: 1
    name: cogito-1m
    folder: Cogito
    interval: 1m
    rules:
      - uid: dlq-fresh
        title: DLQFresh
        condition: C
        for: 5m
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: "dlq_fresh_depth > 0"
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
        annotations:
          summary: "Fresh DLQ failure landed (24h window)"
        labels:
          severity: critical
        # KeepLast: firing alerts survive scrape gaps, only real data resolves.
        noDataState: KeepLast
        execErrState: Error

      - uid: disk-warn
        title: DiskWarn
        condition: C
        for: 10m
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: '100 * (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) > 85'
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
        annotations:
          summary: "VPS disk >= 85% (watchdog warn line)"
        labels:
          severity: warning
        # KeepLast: firing alerts survive scrape gaps, only real data resolves.
        noDataState: KeepLast
        execErrState: Error

      - uid: disk-crit
        title: DiskCrit
        condition: C
        for: 5m
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: '100 * (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) > 92'
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
        annotations:
          summary: "VPS disk >= 92% (watchdog auto-prunes)"
        labels:
          severity: critical
        # KeepLast: firing alerts survive scrape gaps, only real data resolves.
        noDataState: KeepLast
        execErrState: Error

      - uid: api-errors
        title: ApiErrors
        condition: C
        for: 5m
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: '(sum(rate(http_requests_total{status=~"5.."}[5m])) or vector(0)) / sum(rate(http_requests_total[5m])) > 0.01'
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
        annotations:
          summary: "API 5xx ratio above 1% (deploy canary)"
        labels:
          severity: warning
        # KeepLast: firing alerts survive scrape gaps, only real data resolves.
        noDataState: KeepLast
        execErrState: Error

      # Catches a silently-failing scrape (2026-09-07: the cadvisor target
      # went down and nothing fired — no rule watched `up`). Vanished
      # targets (series absent, not 0) evaluate to NoData → KeepLast (hold last
      # state, never silent-OK); Kuma
      # and the watchdog cover host/API independently.
      - uid: target-down
        title: TargetDown
        condition: C
        for: 5m
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: "up == 0"
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
        annotations:
          summary: "Prometheus scrape target down (up == 0 for 5m)"
        labels:
          severity: warning
        # KeepLast: firing alerts survive scrape gaps, only real data resolves.
        noDataState: KeepLast
        execErrState: Error

      # --- Added 2026-09-07 (obs saturation pass) — 7 new rules, existing 5
      # untouched. Routing: default policy receiver Discord-ops (user decision:
      # no new contact points), so no per-rule receiver. for-windows absorb the
      # ~60s Grafana-restart/cAdvisor-60s-scrape gaps: warn rules 10m, crit 5m
      # (matching the existing disk warn/crit pattern), slow-burn rules 30m.
      # KeepLast on every rule (2026-09-07 incident: CpuCrit resolved on NoData
      # after a Prometheus restart — firing alerts now survive gaps; only real
      # data resolves. TargetDown + Kuma cover dead scrapers independently) —
      # each rule carries a comment on what its NoData means.
      - uid: cpu-high
        title: CpuHigh
        condition: C
        for: 10m
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: '100 * (1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 80'
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
        annotations:
          summary: "VPS CPU above 80% for 10m (sustained load — check Infra CPU-by-mode for steal/iowait)"
        labels:
          severity: warning
        # KeepLast: a gap holds the last state instead of resolving;
        # node-exporter death still surfaces via TargetDown.
        # KeepLast: firing alerts survive scrape gaps, only real data resolves.
        noDataState: KeepLast
        execErrState: Error

      - uid: cpu-crit
        title: CpuCrit
        condition: C
        for: 5m
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: '100 * (1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 90'
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
        annotations:
          summary: "VPS CPU above 90% for 5m (saturation — shed load or scale before latency collapses)"
        labels:
          severity: critical
        # KeepLast: same rationale as CpuHigh.
        # KeepLast: firing alerts survive scrape gaps, only real data resolves.
        noDataState: KeepLast
        execErrState: Error

      - uid: mem-high
        title: MemHigh
        condition: C
        for: 10m
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: "100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 85"
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
        annotations:
          summary: "VPS memory above 85% for 10m (check Saturation mem-drain + Infra swap panels for leak vs growth)"
        labels:
          severity: warning
        # KeepLast: gap holds last state; node-exporter death surfaces via TargetDown.
        # KeepLast: firing alerts survive scrape gaps, only real data resolves.
        noDataState: KeepLast
        execErrState: Error

      - uid: mem-crit
        title: MemCrit
        condition: C
        for: 5m
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: "100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 90"
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
        annotations:
          summary: "VPS memory above 90% for 5m (OOM risk — act before the kernel chooses victims)"
        labels:
          severity: critical
        # KeepLast: same rationale as MemHigh.
        # KeepLast: firing alerts survive scrape gaps, only real data resolves.
        noDataState: KeepLast
        execErrState: Error

      - uid: disk-forecast
        title: DiskForecast
        condition: C
        for: 30m
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: 'predict_linear(node_filesystem_avail_bytes{mountpoint="/"}[6h], 24*3600) < 0'
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
        annotations:
          summary: "Rootfs trending to full within 24h (6h linear fit — pairs with Infra panel 7; check Saturation burn-rate before acting)"
        labels:
          severity: warning
        # KeepLast: a fresh Prometheus (retention gap) has <6h of samples and
        # yields NoData rather than a forecast — holds Normal until samples
        # exist; DiskWarn/DiskCrit cover the absolute thresholds independently.
        # KeepLast: firing alerts survive scrape gaps, only real data resolves.
        noDataState: KeepLast
        execErrState: Error

      # Kube-style container restarts do NOT exist in cAdvisor — this watches
      # start-time changes instead. Series container_start_time_seconds is
      # standard cAdvisor but UNVERIFIED live on this host (the 10MB+
      # exposition may get metric groups trimmed — see prometheus.yml). If this
      # rule sits in NoData, verify the series in Prometheus and delete rule +
      # Infra panel 9.
      - uid: container-restart-burst
        title: ContainerRestartBurst
        condition: C
        for: 10m
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: 'sum by (container_label_coolify_resourceName) (changes(container_start_time_seconds{container_label_coolify_resourceName=~".+"}[15m])) > 2'
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
        annotations:
          summary: "Container restarting in a burst (>2 start-time changes in 15m for one Coolify resource — crashloop or redeploy flap)"
        labels:
          severity: warning
        # KeepLast: holds last state through gaps; the healthy case (no restarts =
        # empty vector) still needs the P9 series verification (see comment above).
        # KeepLast: firing alerts survive scrape gaps, only real data resolves.
        noDataState: KeepLast
        execErrState: Error

      # Fires when ZERO nightly-backup success lines land in Loki over the
      # trailing 25h (daily 02:00 WIB cron + 1h margin + 30m for). Success line
      # (infra/backup.sh): `==> Done: uploaded backups/YYYY-MM-DD.sql.gz, …`.
      # SHIPPED THIS WAVE: host log /var/log/cogito-backup.log now tails to Loki
      # as {service="cogito-backup",job="backup"} (Alloy file mount, read-only).
      # Operator: confirm lines in Explore post-apply; until then the nightly
      # check remains `infra/ops.sh dlq` / `ls /var/log/cogito-backup.log`.
      - uid: backup-stale
        title: BackupStale
        condition: C
        for: 30m
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: loki
            model:
              expr: 'count_over_time({service=~".+"} |= "==> Done: uploaded" [25h]) < 1'
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
        annotations:
          summary: "No nightly-backup success heartbeat in Loki for 25h (verify R2 object + /var/log/cogito-backup.log on the VPS — see comment)"
        labels:
          severity: warning
        # KeepLast: holds last state; until the shipping flows, confirm
        # {service="cogito-backup"} lines in Explore post-apply (see caveat above).
        # KeepLast: firing alerts survive scrape gaps, only real data resolves.
        noDataState: KeepLast
        execErrState: Error

      # --- Added 2026-09-11 (Midtrans UAT gate) — 2 new rules, existing 12
      # untouched. Routing: default policy receiver Discord-ops (no new contact
      # points), so no per-rule receiver. The stub rule is critical (prod
      # taking no money is an outage); the gate-spike rule is warning with a
      # 10m window so one curious user never pages anyone.
      # Prod silently on stub: app_info{provider} comes from the backend
      # worker's metric contract (version/provider/provider_mode, value 1).
      - uid: prod-on-stub
        title: ProdOnStub
        condition: C
        for: 5m
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: 'app_info{provider="stub"} == 1'
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
        annotations:
          summary: "API running the stub payment provider (no real checkout — verify PAYMENT_PROVIDER + redeploy)"
        labels:
          severity: critical
        # KeepLast: firing alerts survive scrape gaps, only real data resolves.
        noDataState: KeepLast
        execErrState: Error

      # Burst of test-mode gate rejections: non-UAT purchases hitting the
      # provider-agnostic allowlist (XENDIT_TEST_ALLOWED_EMAILS) on a
      # test-mode domain. Usually an allowlist misconfig during UAT, not a
      # provider outage — check the Payment Logs gate panel first.
      - uid: test-mode-restricted-spike
        title: TestModeRestrictedSpike
        condition: C
        for: 10m
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: loki
            model:
              expr: 'sum(count_over_time({service="cogito-api"} |= "PAYMENT_TEST_MODE_RESTRICTED" [10m])) > 10'
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
        annotations:
          summary: "Test-mode gate rejecting in a burst (>10 PAYMENT_TEST_MODE_RESTRICTED in 10m — check the UAT allowlist)"
        labels:
          severity: warning
        # KeepLast: holds last state through Loki gaps; a quiet gate (empty
        # vector) still needs the Payment Logs panel check (see comment above).
        # KeepLast: firing alerts survive scrape gaps, only real data resolves.
        noDataState: KeepLast
        execErrState: Error
