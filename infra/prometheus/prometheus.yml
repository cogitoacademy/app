# prometheus.yml — Prometheus scrape config (source of truth in git).
#
# Declared by infra/ansible/observability.yml (Coolify service
# `cogito-prometheus`). Retention is a CLI flag, not a file setting:
#   --storage.tsdb.retention.time=15d   (PROM_RETENTION_DAYS=15)
# Lean fallback (tight VPS): scrape_interval 30s + retention 7d (see
# docs/RUNBOOK.md → Monitoring & Alerting → Observability stack) — 30s is
# now the default; the fallback tightens retention only.
#
# SECRET DISCIPLINE: the API /metrics Bearer token lives in the SOPS vault as
# METRICS_TOKEN (never in git). The operator provisions it on the VPS as the
# file /etc/prometheus/metrics_token INSIDE the prometheus container (a
# read-only bind mount of /etc/cogito/observability/prometheus/metrics_token,
# 0644 root:root on the host — see the compose in observability.yml). This file
# references that container path via `credentials_file`, never the value. If
# the file is missing, the cogito-api scrapes 401 (alerts as DOWN targets;
# the API itself is unaffected).
global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  # The app exposition (Task 3): Prometheus text 0.0.4 at GET /metrics,
  # Bearer-gated. Counters http_requests_total{path,method,status}, the
  # http_request_duration_ms_* histogram, dlq_fresh_depth and
  # breaker_state{name} gauges. Per-process semantics: instance="single".
  - job_name: cogito-api
    metrics_path: /metrics
    scheme: https
    static_configs:
      - targets:
          - api.cogitoacademy.id:443
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token

  # Internal API scrape over the shared `cogito-obs` network (dual-scrape:
  # this job PLUS the public job above are both live at once).
  # WHY TWO JOBS: the public job validates the full edge path users feel
  # (Cloudflare -> Traefik -> API, TLS, Bearer) while this job validates the
  # app itself independent of the edge — when one goes DOWN and the other
  # stays UP, the alert tells you whether the failure is the app or the
  # edge, instead of one ambiguous DOWN. The internal path also avoids
  # hairpinning the VPS's own public IP and keeps working through a
  # Cloudflare/proxy incident.
  # WIRING (operator one-time step): the cogito-api container must join
  # cogito-obs with the `cogito-api` alias (e.g. `docker network connect
  # --alias cogito-api cogito-obs <api-container>`; re-apply after every
  # redeploy until Coolify declares it). Until then this target is DOWN by
  # design — the public job above stays the alerting truth meanwhile.
  - job_name: cogito-api-internal
    metrics_path: /metrics
    static_configs:
      - targets:
          - cogito-api:3001
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token

  # Host metrics over the shared `cogito-obs` Docker network (one-time
  # `docker network create`, declared external in every obs compose): the
  # alloy-bundle service names resolve there. Each Coolify service otherwise
  # gets its OWN isolated network (verified live 2026-09-05). Loopback
  # publishes remain for tunnels/debugging.
  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: cadvisor
    # cAdvisor v0.60.5 renders 10MB+ expositions on this host (per-overlay
    # du across dozens of layers; measured 16.5MB in a truncated 20s fetch
    # 2026-09-07). The global 10s timeout can never complete that, so this
    # job scrapes slow, not often — capacity panels tolerate 60s freshness.
    # If scrape_duration_seconds stays near the timeout, trim at the source
    # with --disable_metrics=disk,diskIO (disk panels use node-exporter).
    scrape_interval: 60s
    scrape_timeout: 50s
    static_configs:
      - targets:
          - cadvisor:8080

  # Alloy self-scrape over the shared `cogito-obs` network (same service-name
  # pattern as node-exporter/cadvisor above; no auth). Alloy Flow serves its
  # UI + telemetry on 127.0.0.1:12345 by default. Covers Alloy liveness
  # (TargetDown up==0 alerts when Alloy dies) + component telemetry. Replaces
  # the removed in-container wget healthcheck (the alloy image has no wget).
  - job_name: alloy
    metrics_path: /metrics
    static_configs:
      - targets:
          - alloy:12345
