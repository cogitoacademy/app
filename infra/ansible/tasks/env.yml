# env.yml — apply the SOPS vault env to one Coolify application (included from
# coolify-resources.yml). Only the keys in `app_env_keys` are applied; the
# vault is decrypted on the control node and values are sent straight to the
# Coolify API — never written to disk on the VPS.
---
- name: Build the env payload from the vault (declared keys only)
  ansible.builtin.set_fact:
    app_env_payload: >-
      {%- set ns = namespace(entries=[]) -%}
      {%- for key in app_env_keys -%}
      {%-   if vault_env[key] is defined -%}
      {%-     set ns.entries = ns.entries + [{'key': key, 'value': vault_env[key]}] -%}
      {%-   endif -%}
      {%- endfor -%}
      {{- ns.entries | to_json | from_json -}}

- name: List the application env vars
  ansible.builtin.uri:
    url: "{{ coolify_api_url }}/applications/{{ app_uuid }}/envs"
    method: GET
    headers:
      Authorization: "Bearer {{ vault_env.COOLIFY_API_TOKEN }}"
    status_code: 200
  register: app_envs
  no_log: true

- name: Apply each declared env var (create or update)
  ansible.builtin.uri:
    url: >-
      {{ coolify_api_url }}/applications/{{ app_uuid }}/envs/{{ (app_envs.json | selectattr('key', 'equalto', item.key) | first).uuid }}
    method: PATCH
    headers:
      Authorization: "Bearer {{ vault_env.COOLIFY_API_TOKEN }}"
    body:
      key: "{{ item.key }}"
      value: "{{ item.value }}"
    body_format: json
    status_code: 200
  no_log: true
  loop: "{{ app_env_payload }}"
  loop_control:
    loop_var: item
  when: item.key in (app_envs.json | map(attribute='key') | list)

- name: Create env vars missing on the application
  ansible.builtin.uri:
    url: "{{ coolify_api_url }}/applications/{{ app_uuid }}/envs"
    method: POST
    headers:
      Authorization: "Bearer {{ vault_env.COOLIFY_API_TOKEN }}"
    body:
      key: "{{ item.key }}"
      value: "{{ item.value }}"
    body_format: json
    status_code: 201
  no_log: true
  loop: "{{ app_env_payload }}"
  loop_control:
    loop_var: item
  when: item.key not in (app_envs.json | map(attribute='key') | list)

- name: Report env application
  ansible.builtin.debug:
    msg: >-
      Applied {{ app_env_payload | length }} env vars to {{ app_spec.name }}
      ({{ app_env_payload | map(attribute='key') | join(', ') }}). Values came
      from the SOPS vault on the control node; nothing was written to the VPS.
