# env.yml — apply the SOPS vault env to one Coolify application (included from
# coolify-resources.yml). Only the keys in `app_env_keys` are applied; the
# vault is decrypted on the control node and values are sent straight to the
# Coolify API — never written to disk on the VPS.
---
- name: Build the env payload from the vault (declared keys only)
  ansible.builtin.set_fact:
    app_env_payload: >-
      {%- set ns = namespace(entries=[]) -%}
      {%- for key in app_env_keys -%}
      {%-   if vault_env[key] is defined -%}
      {%-     set ns.entries = ns.entries + [{'key': key, 'value': vault_env[key]}] -%}
      {%-   endif -%}
      {%- endfor -%}
      {{- ns.entries | to_json | from_json -}}

- name: List the application env vars
  ansible.builtin.uri:
    url: "{{ coolify_api_url }}/applications/{{ app_uuid }}/envs"
    method: GET
    headers:
      Authorization: "Bearer {{ vault_env.COOLIFY_API_TOKEN }}"
    status_code: 200
  register: app_envs
  no_log: true

- name: Apply each declared env var (create or update)
  ansible.builtin.uri:
    url: >-
      {{ coolify_api_url }}/applications/{{ app_uuid }}/envs/{{ (app_envs.json | selectattr('key', 'equalto', item.key) | first).uuid }}
    method: PATCH
    headers:
      Authorization: "Bearer {{ vault_env.COOLIFY_API_TOKEN }}"
    body:
      key: "{{ item.key }}"
      value: "{{ item.value }}"
    body_format: json
    status_code: 200
  no_log: true
  register: env_patch_results
  loop: "{{ app_env_payload }}"
  loop_control:
    loop_var: item
    label: "{{ item.key }}"
  when: item.key in (app_envs.json | map(attribute='key') | list)

- name: Create env vars missing on the application
  ansible.builtin.uri:
    url: "{{ coolify_api_url }}/applications/{{ app_uuid }}/envs"
    method: POST
    headers:
      Authorization: "Bearer {{ vault_env.COOLIFY_API_TOKEN }}"
    body:
      key: "{{ item.key }}"
      value: "{{ item.value }}"
    body_format: json
    status_code: 201
  no_log: true
  register: env_create_results
  loop: "{{ app_env_payload }}"
  loop_control:
    loop_var: item
  when: item.key not in (app_envs.json | map(attribute='key') | list)

# F14 (CI-SANITY): a silent skip here is a production false-green — the env
# PATCH/POST loops above once skipped ALL writes while the summary claimed
# success (verified 2026-08-31: container ran PAYMENT_PROVIDER=stub for
# hours after a green playbook). Assert every declared key was processed.
- name: Verify every declared env key was applied (fail loud on silent skip)
  ansible.builtin.assert:
    that:
      - (env_patch_results.results | selectattr('skipped', 'defined') | selectattr('skipped', 'equalto', false) | list | length) + (env_create_results.results | default([]) | selectattr('skipped', 'equalto', false) | list | length) == (app_env_keys | select('in', vault_env) | list | length)
    fail_msg: >-
      ENV APPLICATION INCOMPLETE: declared {{ app_env_payload | length }} keys
      but only some were processed. GET result keys:
      {{ app_envs.json | default([]) | map(attribute='key') | list | first | default('LIST-SHAPE-ERROR') }}
      This is a FAIL-LOUD guard against a false-green env switch.
    success_msg: "Every declared env key was written (patched or created)."
  when: app_env_payload | length > 0

- name: Count applied env writes (fail loud on partial application)
  ansible.builtin.assert:
    that:
      - env_patch_results.results | default([]) | selectattr('changed', 'equalto', true) | list | length + env_create_results.results | default([]) | selectattr('changed', 'equalto', true) | list | length > 0 or app_env_payload | length == 0
    fail_msg: >-
      ZERO env vars were written for {{ app_spec.name }} — every write was
      skipped or failed. This was previously a SILENT false green
      (CI-SANITY F14): the container kept stale values (PAYMENT_PROVIDER=stub)
      for hours after a green playbook. Check the token's endpoint
      permissions (read+write on the applications/envs class) and re-run.
    quiet: false
  when: app_env_payload | length > 0

- name: Report env application
  ansible.builtin.debug:
    msg: >-
      Applied {{ app_env_payload | length }} env vars to {{ app_spec.name }}
      ({{ app_env_payload | map(attribute='key') | join(', ') }}). Values came
      from the SOPS vault on the control node; nothing was written to the VPS.

# Env changes only reach the container when the resource restarts. CD owns
# deploys, but an env switch is a one-time restart event (same class as the
# Traefik config paste) — restart here and VERIFY. Closes the second half of
# the F14 false green: a green PATCH with no restart still leaves the old env
# in the running container (verified live: PAYMENT_PROVIDER=stub for hours).
- name: Restart the application so env changes reach the container
  ansible.builtin.uri:
    url: "{{ coolify_api_url }}/applications/{{ app_uuid }}/restart"
    method: POST
    headers:
      Authorization: "Bearer {{ vault_env.COOLIFY_API_TOKEN }}"
    status_code: [200, 201, 202]
  register: app_restart
  no_log: false
  when: app_spec.name == "cogito-api"

- name: Poll /health until the restarted app is ok (bounded ~5 min)
  ansible.builtin.uri:
    url: "https://api.cogitoacademy.id/health"
    method: GET
    return_content: true
    status_code: 200
    timeout: 15
  register: health_after
  retries: 20
  delay: 15
  until: (health_after.content | from_json).status | default('') == 'ok'
  when: app_spec.name == "cogito-api"
