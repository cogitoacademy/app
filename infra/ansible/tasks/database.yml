# database.yml — re-declare one Coolify database (included from
# coolify-resources.yml). NEVER recreates an existing database: if a database
# with the declared name exists, only its image is compared and drift is
# reported. Creation happens ONLY when the name is missing, and prints a loud
# warning — the operator must confirm the existing container was not renamed
# before letting a new empty database be created (data lives in the existing
# container's volume).
---
- name: Find the database by name
  ansible.builtin.set_fact:
    db_found: "{{ databases_live.json | selectattr('name', 'equalto', db_spec.name) | list }}"

- name: Database exists — compare image (drift check, no changes)
  ansible.builtin.debug:
    msg: >-
      Database {{ db_spec.name }} exists (uuid={{ db_found[0].uuid }},
      image={{ db_found[0].image | default('unknown') }}).
      {% if db_found[0].image is defined and db_found[0].image != db_spec.image
      %}DRIFT: declared image {{ db_spec.image }} != live {{ db_found[0].image }}
      — fix the declared value or the live container, then re-run.{% else %}
      Image matches the declaration ({{ db_spec.image }}). No changes.{% endif %}
  when: db_found | length > 0

- name: Database missing — create a NEW EMPTY database (loud warning)
  ansible.builtin.uri:
    url: "{{ coolify_api_url }}/databases/{{ db_spec.type }}"
    method: POST
    headers:
      Authorization: "Bearer {{ vault_env.COOLIFY_API_TOKEN }}"
    body:
      project_uuid: "{{ project_uuid }}"
      environment_name: "{{ environment_name }}"
      server_uuid: "{{ server_uuid }}"
      name: "{{ db_spec.name }}"
      image: "{{ db_spec.image }}"
    body_format: json
    status_code: 201
  register: db_created
  no_log: true
  when: db_found | length == 0

- name: WARN — a new empty database was created
  ansible.builtin.debug:
    msg: >-
      !!! Database {{ db_spec.name }} did not exist and a NEW EMPTY database
      was created (uuid={{ db_created.json.uuid }}). If the production
      container still exists under a different name, STOP and rename it back
      (or point the app at it) — the new database is empty and the old one
      holds the data. Never delete the old container.
  when: db_found | length == 0
