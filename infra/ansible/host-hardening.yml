# Host hardening — replaces the ad-hoc bits of infra/provision.sh with an
# idempotent, declarative playbook. Safe to re-run.
#
# Run: ansible-playbook -i infra/ansible/inventory.ini \
#        infra/ansible/host-hardening.yml --ask-become-pass
---
- name: Harden the Cogito VPS host
  hosts: cogito_vps
  become: true
  gather_facts: true

  vars:
    # Tailnet CIDR — only these sources reach the control plane.
    tailnet_cidr: "100.64.0.0/10"
    # Coolify control ports must be tailnet/loopback only.
    coolify_ports:
      - "8000" # dashboard
      - "6001" # realtime
      - "6002" # realtime
    # ORIGIN-BYPASS GROUNDWORK (not enforced — commented sketch only).
    # Today 80/443 are open to the world (task "UFW allow public web" below):
    # Cloudflare proxies the app, but the origin IP (15.235.186.159) is
    # discoverable (DNS history, direct hits), so an attacker can bypass
    # Cloudflare WAF/rate-limits by talking to the origin directly. The
    # target state is: 80/443 reachable ONLY from Cloudflare egress, PLUS
    # Authenticated Origin Pull so the origin only answers Cloudflare-held
    # client certs. Do NOT flip this without the operator console steps in
    # the reliability report (order matters: allow CF ranges BEFORE removing
    # the public allow, or the site goes dark; ranges rotate — refresh them
    # on a schedule, not once).
    # Sketch (replace the "UFW allow public web" task when approved):
    #   - name: UFW allow web from Cloudflare egress only
    #     community.general.ufw:
    #       rule: allow
    #       port: "{{ item[1] }}"
    #       proto: tcp
    #       from_ip: "{{ item[0] }}"
    #     loop: "{{ cloudflare_ipv4_ranges | product([80, 443]) | list }}"
    #     # ranges fetched live, never pasted: curl -s https://www.cloudflare.com/ips-v4
    #     # (+ ips-v6 with `from_ip` v6 entries; requires `ufw allow ... ` per range)
    # Authenticated Origin Pull (Cloudflare dashboard SSL/TLS -> Origin
    # Server -> ON, plus a Traefik TLS option presenting the Cloudflare
    # origin CA for client-cert verification on the edge router) is the
    # second half — origin rejects non-Cloudflare TLS even from an allowed
    # IP. Traefik is Coolify-managed, so its client-cert stanza is a UI
    # custom-config change with its own verify step, not part of this file.

  tasks:
    - name: Install base packages
      ansible.builtin.apt:
        name:
          - ufw
          - fail2ban
          - unattended-upgrades
          - git
          - curl
        state: present
        update_cache: true

    - name: Enable unattended-upgrades
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
          APT::Periodic::AutocleanInterval "7";

    - name: UFW default deny incoming
      community.general.ufw:
        state: enabled
        policy: deny
        direction: incoming

    - name: UFW allow public web (Cloudflare-proxied)
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop: [80, 443]

    - name: UFW remove any public SSH allow (bootstrap leftover — self-healing)
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp
        delete: true
      ignore_errors: true

    - name: UFW allow SSH from tailnet only
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp
        from_ip: "{{ tailnet_cidr }}"

    - name: UFW allow Coolify control ports from tailnet only
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
        from_ip: "{{ tailnet_cidr }}"
      loop: "{{ coolify_ports }}"

    # ufw.log must stay syslog:adm-writable across rotation — else rsyslog
    # suspend-loops on open error (seen 2026-08-30..09-08 when file was absent).
    - name: UFW logrotate creates ufw.log with rsyslog-writable ownership
      ansible.builtin.lineinfile:
        path: /etc/logrotate.d/ufw
        regexp: ^\s*create\b.*
        line: "  create 640 syslog adm"
        insertafter: ^/var/log/ufw\.log
        state: present

    - name: Ensure /var/log/ufw.log exists with rsyslog-writable ownership
      ansible.builtin.file:
        path: /var/log/ufw.log
        state: touch
        owner: syslog
        group: adm
        mode: "0640"
        modification_time: preserve
        access_time: preserve

    - name: Fail2ban sshd jail enabled
      ansible.builtin.copy:
        dest: /etc/fail2ban/jail.local
        content: |
          [sshd]
          enabled = true
          maxretry = 5
          bantime = 1h
          ignoreip = 127.0.0.1/8 ::1 10.0.0.0/8
      notify: restart fail2ban

    - name: SSH — no password auth, root key-only
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/00-cogito-hardening.conf
        content: |
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitRootLogin prohibit-password
      notify: reload ssh

  handlers:
    - name: restart fail2ban
      ansible.builtin.service:
        name: fail2ban
        state: restarted

    - name: reload ssh
      ansible.builtin.service:
        name: ssh
        state: reloaded
