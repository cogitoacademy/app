# Inventory — the single server. Variables come from group_vars (SOPS-encrypted
# secrets are decrypted at apply time, never stored here).
[cogito_vps]
# MagicDNS (matches ops.sh OPS_VPS default) — never a hardcoded tailnet IP.
cogito-vps.tail674634.ts.net ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/cogito_vps
