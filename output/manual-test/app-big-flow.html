    <style>
      body {
        margin: 0;
        font-family: var(--font-sans, system-ui);
        color: var(--foreground);
      }
      .controls {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 10px;
      }
      button {
        font: inherit;
        padding: 6px 12px;
        background: var(--secondary);
        color: var(--foreground);
        border: 1px solid var(--border);
        border-radius: var(--radius, 8px);
      }
      small,
      #detail {
        color: var(--muted-foreground);
        font-size: 12px;
      }
      .viewport {
        overflow: auto;
        height: 1050px;
        touch-action: pan-x pan-y;
      }
      .canvas {
        position: relative;
      }
      svg {
        display: block;
        transform-origin: top left;
      }
      .node rect {
        fill: var(--secondary);
        stroke: var(--border);
        stroke-width: 1.5;
      }
      .node text {
        fill: var(--foreground);
        font-size: 13px;
        font-weight: 600;
      }
      .node .sub {
        font-size: 11px;
        font-weight: 400;
        fill: var(--muted-foreground);
      }
      .node {
        cursor: crosshair;
      }
      .node:focus rect,
      .node.selected rect {
        stroke: var(--primary);
        stroke-width: 3;
      }
      .edge path {
        fill: none;
        stroke: var(--muted-foreground);
        stroke-width: 1.5;
        opacity: 0.65;
      }
      .edge text {
        fill: var(--foreground);
        font-size: 10px;
        paint-order: stroke;
        stroke: var(--background);
        stroke-width: 4;
        stroke-linejoin: round;
      }
      .effect path {
        stroke: var(--chart-2);
        stroke-dasharray: 6 5;
        opacity: 0.35;
      }
      .edge.hot path {
        stroke: var(--primary);
        stroke-width: 3;
        opacity: 1;
      }
      .edge.dim {
        opacity: 0.12;
      }
      marker path {
        fill: var(--muted-foreground);
      }
      #detail {
        min-height: 35px;
        margin: 8px 0;
      }
      .legend {
        font-size: 12px;
        color: var(--muted-foreground);
        margin-bottom: 10px;
      }
    </style>
  </head>

        z = Math.max(0.2, Math.min(1.5, v));
        svg.style.transform = "scale(" + z + ")";
        canvas.style.width = 2400 * z + "px";
        canvas.style.height = 2250 * z + "px";
        document.getElementById("zoom").textContent = Math.round(z * 100) + "%";
      }
      document.getElementById("in").onclick = () => scale(z + 0.15);
      document.getElementById("out").onclick = () => scale(z - 0.15);
      document.getElementById("fit").onclick = () =>
        scale((vp.clientWidth - 8) / 2400);
      document.getElementById("read").onclick = () => scale(1);
      function clear() {
        document
          .querySelectorAll(".edge")
          .forEach((e) => e.classList.remove("hot", "dim"));
        document
          .querySelectorAll(".node")
          .forEach((e) => e.classList.remove("selected"));
      }
      document.getElementById("reset").onclick = clear;
      function select(e) {
        const el = e.target.closest(".node");
        if (!el) return;
        clear();
        el.classList.add("selected");
        const id = el.dataset.id,
          n = nodes.find((n) => n.id === id);
        document.getElementById("detail").textContent = n.t + " — " + n.s;
        document
          .querySelectorAll(".edge")
          .forEach((p) =>
            p.classList.add(
              p.dataset.a === id || p.dataset.b === id ? "hot" : "dim",
            ),
          );
      }
      svg.addEventListener("click", select);
      svg.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          select(e);
        }
      });
