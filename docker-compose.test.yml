name: cogito-app-test

services:
  postgres:
    image: postgres:16-alpine
    container_name: cogito-app-postgres-test
    environment:
      POSTGRES_DB: cogito-test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "6767:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    # C6: give postgres time to fast-shutdown instead of killing pooled
    # connections with SIGKILL (shutdown FATAL spam).
    stop_grace_period: 30s

  redis:
    image: redis:7-alpine
    container_name: cogito-app-redis-test
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  cogito-app_postgres_data:
