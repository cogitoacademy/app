# SOPS — secrets encryption config.
#
# Keys: one Age public key per operator + CI. Generate:
#   age-keygen -o ~/.config/sops/age/keys.txt   # operator (private, off-repo)
#   sops --age <public-key> infra/secrets/prod.env
#
# The private key NEVER enters the repository. `sops -d` output is piped
# directly into Ansible (`-e @<(sops -d ...)`) or the Coolify API at apply
# time — never written to disk.
creation_rules:
  - path_regex: infra/secrets/.*\.env$
    encrypted_regex: "^(BETTER_AUTH_SECRET|PAYMENT_WEBHOOK_SECRET|RESEND_API_KEY|XENDIT_SECRET_KEY|XENDIT_WEBHOOK_TOKEN|XENDIT_TEST_ALLOWED_EMAILS|WEBHOOK_ALLOWED_IPS|GOOGLE_CLIENT_ID|GOOGLE_CLIENT_SECRET|GOOGLE_CLIENT_EMAIL|GOOGLE_IMPERSONATED_USER|GOOGLE_MEET_CLIENT_ID|GOOGLE_MEET_CLIENT_SECRET|GOOGLE_MEET_REFRESH_TOKEN|GOOGLE_PRIVATE_KEY|R2_ACCESS_KEY_ID|R2_SECRET_ACCESS_KEY|R2_ACCOUNT_ID|COOLIFY_API_TOKEN|CLOUDFLARE_API_TOKEN|SANITY_API_TOKEN|METRICS_TOKEN|DATABASE_URL|REDIS_URL|TS_AUTH_KEY|ADMIN_EMAILS|SENTRY_DSN|GOOGLE_CALENDAR_ID)$"
    age: age12aualuya2dy244zh6lmk0ajvmsmdv5qg7qeraxh40w8xd380n9lqthu3se
