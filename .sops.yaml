# SOPS — secrets encryption config.
#
# Keys: one Age public key per operator + CI. Generate:
#   age-keygen -o ~/.config/sops/age/keys.txt   # operator (private, off-repo)
#   sops --age <public-key> infra/secrets/prod.env
#
# The private key NEVER enters the repository. `sops -d` output is piped
# directly into Ansible (`-e @<(sops -d ...)`) or the Coolify API at apply
# time — never written to disk.
creation_rules:
  - path_regex: infra/secrets/.*\.env$
    # Covers every key in coolify-resources.yml `app_env_keys` (so any app env
    # var the playbook applies is encrypted at rest) plus ops-only vault keys
    # (COOLIFY_API_TOKEN, CLOUDFLARE_API_TOKEN, TS_AUTH_KEY, R2_BACKUP_BUCKET,
    # ...). Non-sensitive config (PORT, NODE_ENV, ...) is encrypted too by
    # uniformity — the whole file is one encrypted unit.
    encrypted_regex: "^(BETTER_AUTH_SECRET|PAYMENT_WEBHOOK_SECRET|RESEND_API_KEY|XENDIT_SECRET_KEY|XENDIT_WEBHOOK_TOKEN|XENDIT_TEST_ALLOWED_EMAILS|WEBHOOK_ALLOWED_IPS|GOOGLE_CLIENT_ID|GOOGLE_CLIENT_SECRET|GOOGLE_CLIENT_EMAIL|GOOGLE_IMPERSONATED_USER|GOOGLE_MEET_CLIENT_ID|GOOGLE_MEET_CLIENT_SECRET|GOOGLE_MEET_REFRESH_TOKEN|GOOGLE_PRIVATE_KEY|R2_ACCESS_KEY_ID|R2_SECRET_ACCESS_KEY|R2_ACCOUNT_ID|COOLIFY_API_TOKEN|CLOUDFLARE_API_TOKEN|SANITY_API_TOKEN|METRICS_TOKEN|DATABASE_URL|REDIS_URL|TS_AUTH_KEY|ADMIN_EMAILS|SENTRY_DSN|GOOGLE_CALENDAR_ID|DISCORD_WEBHOOK_URL|GRAFANA_ADMIN_PASSWORD|NODE_ENV|BETTER_AUTH_URL|CORS_ORIGIN|PORT|TRUST_PROXY|PAYMENT_PROVIDER|XENDIT_MODE|XENDIT_SUCCESS_REDIRECT_URL|XENDIT_FAILURE_REDIRECT_URL|XENDIT_DEFAULT_PAYMENT_METHOD|MIDTRANS_MODE|MIDTRANS_SERVER_KEY|MIDTRANS_CLIENT_KEY|MIDTRANS_MERCHANT_ID|MIDTRANS_WEBHOOK_SIGNATURE_KEY|SCHEDULER_ENABLED|EMAIL_FROM|GOOGLE_MEET_ENABLED|SESSION_COOKIE_CACHE_MAX_AGE|R2_BUCKET|R2_PUBLIC_URL|R2_BACKUP_BUCKET|SANITY_PROJECT_ID|SANITY_DATASET|SANITY_API_VERSION|DB_SSL_ENABLED|DB_SSL_REJECT_UNAUTHORIZED|SEED_ALLOWED_IN_PROD|SENTRY_ENVIRONMENT)$"
    age: age12aualuya2dy244zh6lmk0ajvmsmdv5qg7qeraxh40w8xd380n9lqthu3se
