name: cogito-app-test-payout

services:
  postgres:
    image: postgres:16-alpine
    container_name: cogito-app-postgres-test-payout
    environment:
      POSTGRES_DB: cogito-test-payout
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "127.0.0.1:6770:5432"
    volumes:
      - cogito_test_payout_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cogito-test-payout"]
      interval: 5s
      timeout: 3s
      retries: 10
    stop_grace_period: 30s

  redis:
    image: redis:7-alpine
    container_name: cogito-app-redis-test-payout
    ports:
      - "127.0.0.1:6382:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  cogito_test_payout_data:
    name: cogito-t03-payout-20261021-data
