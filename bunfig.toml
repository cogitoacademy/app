[install]
linker = "isolated"

[test]
coverageReporter = ["text", "lcov"]
coverageDir = "coverage"
coverageSkipTestFiles = true
coverageThreshold = { lines = 0.8, functions = 0.8, statements = 0.8 }
coveragePathIgnorePatterns = [
  "node_modules/",
  "dist/",
  "packages/ui/",
  "packages/config/",
  "packages/env/",
  # Drizzle schema files are declarative table definitions; Bun reports
  # synthetic function counters for them rather than executable behavior.
  "packages/db/src/schema/**",
  "packages/e2e/",
  "**/*.test.ts",
  "**/routeTree.gen.ts",
  "apps/web/src/main.tsx",
  "apps/server/src/seed*.ts",
  "apps/server/src/openapi.ts",
]
