[install]
linker = "isolated"

[test]
coverage = false
coverageReporter = ["text", "lcov"]
coverageDir = "coverage"
coverageSkipTestFiles = true
coverageThreshold = { lines = 0.5, functions = 0.5, statements = 0.5 }
coveragePathIgnorePatterns = [
  "node_modules/",
  "dist/",
  "packages/ui/",
  "packages/config/",
  "packages/env/",
  "**/*.test.ts",
  "**/routeTree.gen.ts",
  "apps/web/src/main.tsx",
  "apps/server/src/seed*.ts",
  "apps/server/src/openapi.ts",
]
