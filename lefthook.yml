pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{ts,tsx,js,jsx}"
      run: bunx oxlint {staged_files}
    format:
      glob: "*.{ts,tsx,js,jsx,json}"
      run: bunx oxfmt --write {staged_files}
    sops-plaintext-guard:
      glob: "infra/secrets/prod.env"
      # Per-key check against .sops.yaml encrypted_regex: any listed key
      # whose value is not ENC[...] ciphertext fails the commit.
      run: bun scripts/check-sops-encrypted.ts {staged_files}

pre-push:
  parallel: true
  commands:
    typecheck:
      run: bun run check-types
    lint:
      run: bun .github/lint/check-baseline.ts
