pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{ts,tsx,js,jsx}"
      run: bunx oxlint {staged_files}
    format:
      glob: "*.{ts,tsx,js,jsx,json}"
      run: bunx oxfmt --write {staged_files}

pre-push:
  parallel: true
  commands:
    typecheck:
      run: bun run check-types
    lint:
      run: bun run lint
