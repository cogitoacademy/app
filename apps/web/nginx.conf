server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    # HSTS is honored by browsers only over HTTPS (TLS terminates at the
    # edge proxy); harmless on plain HTTP, protective once served via TLS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    # connect-src stays scheme-open so staging/preview API origins keep
    # working; page itself never loads scripts/styles from third parties.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # SPA fallback: HTML must never cache, or clients pin stale asset hashes.
    # NOTE: `expires` (not `add_header`) is used here on purpose — any
    # `add_header` inside a location discards the whole server-level header
    # set for those responses, which would strip CSP/HSTS from every page.
    location / {
        try_files $uri $uri/ /index.html;
        expires 0;
    }

    location = /index.html {
        expires 0;
    }

    location /assets/ {
        expires 1y;
        # Same inheritance rule: this `add_header` resets the server-level
        # set for asset responses, so the asset-relevant headers repeat here.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, immutable" always;
    }
}